name: Update README with GitHub Stats

on:
  schedule:
    # Runs 3 times every day (8:00 AM, 4:00 PM, and 12:00 AM IST) for guaranteed daily commits
    - cron: '30 2,10,18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Edge-Explorer
        run: python update_readme.py
      
      - name: Commit changes
        run: |
          git config --local user.email "karanshelar8775@gmail.com"
          git config --local user.name "Karan Shelar"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): auto-update daily GitHub stats and views"
            git pull --rebase origin main
            git push
          fi
