name: Super Automated Profile Automation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every night at midnight
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Update the Top Repositories list
      - uses: actions/checkout@v3
      - name: Update Top Repositories
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_OS: "false"
          SHOW_PROJECTS: "false"
          SHOW_TIME: "false"
          SHOW_LINES_OF_CODE: "true"
          SHOW_LOC_CHART: "false"
          SHOW_TOTAL_CODE_TIME: "false"
          SHOW_TOP_LANG: "false"

      # Step 2: Generate the High-Tech Metrics Dashboard
      - name: Generate Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Edge-Explorer
          template: classic
          base: header, activity, community, metadata
          config_timezone: Asia/Kolkata
          
          # Plugins for "The Perfect Look"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used
          
          plugin_stars: yes
          plugin_stars_limit: 4

          config_padding: 0, 8 + 10%
          filename: github-metrics.svg
